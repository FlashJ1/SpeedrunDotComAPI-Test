<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Marhey:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>SpeedrunDotComAPI</title>
</head>
<body>
    <h1 class="marhey-text" id="titleName">SpeedrunDotComAPI</h1>
    <div id="searchUI">
        <div id="userSearch">
            <input type="text" class="searchItem marhey-text" id="gameSearch" placeholder="Enter the game">
            <button class="searchItem marhey-text" id="searchBt" onclick="searchGame()">Search</button>
        </div>
        <div id="resultAllGames"></div>
    </div>
    
    <div id="gameBody">
        <div id="gameInfo">
            <label class="marhey-text" id="gameName"></label>
            <img src="" alt="" id="gameCover">
        </div>
        <div id="categoryInfo">
            <div id="categories">
                <select name="" class="categoryItems marhey-text" id="categorySelect"></select>
                <div id="subCategories"></div>
            </div>
            <div id="players"></div>
            <label class="marhey-text categoryItems" id="lbTime"></label>
        </div>
        
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
